<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact Me</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
	h1 {
		text-align: center;
		font: 54pt/1.4em 'Bodoni MT';
	} form {
		width: 600px;
		height: 400px;
		// background: url("ghost-billboard.png");
		background: #469748;
		background-size: 100%;
		background-position: center;
		margin: 0 auto;
		font: 14pt/1.4em 'Cambria, sans-serif';
		padding: 24px;
		color: white;
	} input[type="text"], textarea {
		width: 98%;
		margin-bottom: 12px;
		font-size: 14pt;
		//background: transparent;
	} textarea {
		height: 100px;
	} input[type="submit"] {
		display: block;
		margin: 12px auto;
		width: 100px;
		height: 40px;
		border-radius: 6px;
		border: 1px solid #FFFFFF;
		font-size: 14pt;
	} input[type="submit"]:hover {
		box-shadow: 2px 3px 6px gray;
	} header img {
		height: 400px;
		display: block;
		margin: 0 auto;
	}
</style>
</head>

<body>
	<header><img src="billboard.png" /></header>
	<h1> CONTACT ME</h1>
	<form action="#" method="post">
	<label>Name</label><br/>
	<input type="text" /><br/>
	<label>Inquiry</label><br/>
	<input type="text" /><br/>
	<label>Email</label><br/>
	<input type="text" /><br/>
	<label>Message</label><br/>
	<textarea placeholder="Write message here."></textarea><br/>
	<input type="submit" />
	</form>
</body>
</html>
